[project]
name = "solstein"
version = "2.0.0"
description = "Internal prospecting tool for AI-Whisperers' equity-for-transformation deal team"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "AI Whisperers", email = "team@ai-whisperers.com" }]
license = { text = "Proprietary" }

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3",
    "click>=8.1",
    "rich>=13.7",
    "loguru>=0.7",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    "tenacity>=8.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-httpx>=0.30",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-openpyxl",
]

[project.scripts]
solstein = "solstein.cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/solstein"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "B",         # flake8-bugbear
    "UP",        # pyupgrade
    "SIM",       # flake8-simplify
    "RUF",       # ruff-specific
    "N",         # pep8-naming
    "C4",        # comprehensions
    "ERA",       # no commented-out code
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
markers = [
    "integration: hits real external services (gated by env vars)",
    "slow: >1s test",
]

[tool.coverage.run]
source = ["src/solstein"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
show_missing = true
